{% extends 'gmf/base.html' %}
{% block title %}Mi perfil · GMFitness{% endblock %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">CUENTA</div><h1>Mi perfil</h1><p class="muted">Mantén actualizados tus datos de contacto.</p></div></div><section class="form-card"><form method="post" class="form-grid">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="error">{{ field.errors|join:', ' }}</small>{% endif %}</label>{% endfor %}<div class="form-actions"><button class="button button-primary">Guardar cambios</button></div></form></section>{% endblock %}
